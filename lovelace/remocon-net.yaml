## Remocon-NET-style Home Assistant dashboard
##
## Paste each top-level block below into a separate "Manual card" on a new
## Lovelace dashboard, or import the whole `views:` block as a YAML-mode
## dashboard.
##
## Required entities (created by the AppDaemon app):
##   sensor.elco_room_temperature, sensor.elco_outside_temperature,
##   sensor.elco_desired_room_temperature, sensor.elco_room_operation_mode_heating,
##   sensor.elco_domestic_hot_water_storage_temperature, sensor.elco_domestic_hot_water_temperature,
##   sensor.elco_holiday_until, sensor.elco_schedule_{monday..sunday},
##   binary_sensor.elco_flame_sensor, binary_sensor.elco_heatpump_on,
##   binary_sensor.elco_room_heating_is_active, binary_sensor.elco_holiday_active
##
## Required helpers (HA configuration.yaml — see fleet/home-assistant/home-assistant-cm.yml):
##   input_number.elco_ch_comfort_temp_set, input_number.elco_ch_reduced_temp_set,
##   input_number.elco_dhw_comfort_temp_set, input_number.elco_dhw_reduced_temp_set,
##   input_select.elco_zone_mode_set, input_select.elco_dhw_mode_set,
##   input_boolean.elco_holiday_active, input_datetime.elco_holiday_until
##
## HACS dependencies (optional — schedule card uses apexcharts):
##   - custom:apexcharts-card  (https://github.com/RomRider/apexcharts-card)
##   Without it, swap the schedule card for the markdown fallback at the bottom.

title: Chauffage
path: chauffage
icon: mdi:radiator
cards:
  ##################################################################
  # 1) Top status row — outside temp, flame, heating active
  ##################################################################
  - type: horizontal-stack
    cards:
      - type: tile
        entity: sensor.elco_outside_temperature
        name: Outside
        icon: mdi:thermometer
        color: blue
      - type: tile
        entity: binary_sensor.elco_flame_sensor
        name: Flame
        icon: mdi:fire
        color: orange
        state_content: state
      - type: tile
        entity: binary_sensor.elco_room_heating_is_active
        name: Heating
        icon: mdi:radiator
        color: red

  ##################################################################
  # 2) Main Chauffage card — gauge with room temp, current desired temp,
  #    +/- buttons that nudge the comfort setpoint, then 4 mode buttons.
  ##################################################################
  - type: vertical-stack
    cards:
      - type: gauge
        entity: sensor.elco_room_temperature
        name: Home temperature
        min: 5
        max: 30
        needle: true
        segments:
          - from: 5
            color: '#3b82f6'
          - from: 15
            color: '#facc15'
          - from: 19
            color: '#f97316'
          - from: 23
            color: '#dc2626'
      - type: glance
        show_name: true
        show_state: true
        columns: 3
        entities:
          - entity: sensor.elco_desired_room_temperature
            name: Setpoint
          - entity: sensor.elco_comfort_room_temperature_setpoint
            name: Comfort
          - entity: sensor.elco_reduced_room_temperature_setpoint
            name: Reduced

      # +/- nudge buttons (0.5 °C) on the comfort setpoint
      - type: horizontal-stack
        cards:
          - type: button
            name: '−'
            icon: mdi:minus
            tap_action:
              action: call-service
              service: input_number.set_value
              target:
                entity_id: input_number.elco_ch_comfort_temp_set
              data:
                value: >-
                  {{ (states('input_number.elco_ch_comfort_temp_set') | float - 0.5) | round(1) }}
          - type: button
            entity: input_number.elco_ch_comfort_temp_set
            name: Comfort setpoint
            show_state: true
          - type: button
            name: '+'
            icon: mdi:plus
            tap_action:
              action: call-service
              service: input_number.set_value
              target:
                entity_id: input_number.elco_ch_comfort_temp_set
              data:
                value: >-
                  {{ (states('input_number.elco_ch_comfort_temp_set') | float + 0.5) | round(1) }}

      # 4 mode buttons — Auto / Comfort / Reduced / Off (Protection). The
      # currently-active mode renders as a coloured tile; the others as plain
      # buttons. Tapping a non-active button writes the new value to
      # input_select.elco_zone_mode_set; AppDaemon picks the change up and
      # propagates to the boiler.
      - type: horizontal-stack
        cards:
          # --- Auto ---
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state: Automatic
            card:
              type: tile
              entity: input_select.elco_zone_mode_set
              name: Auto
              icon: mdi:clock-outline
              color: indigo
              hide_state: true
              tap_action: { action: none }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state_not: Automatic
            card:
              type: button
              name: Auto
              icon: mdi:clock-outline
              tap_action:
                action: call-service
                service: input_select.select_option
                target: { entity_id: input_select.elco_zone_mode_set }
                data: { option: Automatic }
          # --- Comfort ---
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state: Comfort
            card:
              type: tile
              entity: input_select.elco_zone_mode_set
              name: Comfort
              icon: mdi:weather-sunny
              color: orange
              hide_state: true
              tap_action: { action: none }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state_not: Comfort
            card:
              type: button
              name: Comfort
              icon: mdi:weather-sunny
              tap_action:
                action: call-service
                service: input_select.select_option
                target: { entity_id: input_select.elco_zone_mode_set }
                data: { option: Comfort }
          # --- Reduced ---
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state: Reduced
            card:
              type: tile
              entity: input_select.elco_zone_mode_set
              name: Reduced
              icon: mdi:weather-night
              color: blue
              hide_state: true
              tap_action: { action: none }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state_not: Reduced
            card:
              type: button
              name: Reduced
              icon: mdi:weather-night
              tap_action:
                action: call-service
                service: input_select.select_option
                target: { entity_id: input_select.elco_zone_mode_set }
                data: { option: Reduced }
          # --- Off (Protection) ---
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state: Protection
            card:
              type: tile
              entity: input_select.elco_zone_mode_set
              name: 'Off'
              icon: mdi:power
              color: grey
              hide_state: true
              tap_action: { action: none }
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.elco_zone_mode_set
                state_not: Protection
            card:
              type: button
              name: 'Off'
              icon: mdi:power
              tap_action:
                action: call-service
                service: input_select.select_option
                target: { entity_id: input_select.elco_zone_mode_set }
                data: { option: Protection }

  ##################################################################
  # 3) Weekly schedule (Chauffage screen 2)
  #    Markdown table that renders each day's slices "HH:MM→T°".
  #    This is the no-HACS default; for the bar visual seen in the
  #    Remocon screenshot, add an `apexcharts-card` (HACS) of your own
  #    that reads the same `slices` attributes — see DASHBOARD.md.
  ##################################################################
  - type: markdown
    title: Weekly schedule
    content: |
      {%- set days = [('Sun','sunday'),('Mon','monday'),('Tue','tuesday'),
                      ('Wed','wednesday'),('Thu','thursday'),
                      ('Fri','friday'),('Sat','saturday')] -%}
      {%- set comfort_t = (state_attr('sensor.elco_schedule_monday','intervals') or [])
                          | selectattr('mode','eq','comfort')
                          | map(attribute='temp') | first | default(0) -%}
      {%- set reduced_t = (state_attr('sensor.elco_schedule_monday','intervals') or [])
                          | selectattr('mode','eq','reduced')
                          | map(attribute='temp') | first | default(0) -%}
      {#- Build (short, fingerprint) per day. Fingerprint = "start-end,start-end..." -#}
      {%- set per_day = namespace(items=[]) -%}
      {%- for short, suf in days -%}
        {%- set iv = state_attr('sensor.elco_schedule_' ~ suf, 'intervals') or [] -%}
        {%- set c = iv | selectattr('mode','eq','comfort') | list -%}
        {%- set windows = [] -%}
        {%- for x in c -%}
          {%- set _ = windows.append(x.start_hhmm ~ '–' ~ x.end_hhmm) -%}
        {%- endfor -%}
        {%- set fp = windows | join(', ') if windows else 'off' -%}
        {%- set _ = per_day.items.append((short, fp)) -%}
      {%- endfor -%}
      {#- Collapse consecutive days with the same fingerprint into ranges -#}
      {%- set groups = namespace(items=[], cur_start=none, cur_end=none, cur_fp=none) -%}
      {%- for short, fp in per_day.items -%}
        {%- if groups.cur_fp is none -%}
          {%- set groups.cur_start = short -%}{%- set groups.cur_end = short -%}{%- set groups.cur_fp = fp -%}
        {%- elif fp == groups.cur_fp -%}
          {%- set groups.cur_end = short -%}
        {%- else -%}
          {%- set _ = groups.items.append((groups.cur_start, groups.cur_end, groups.cur_fp)) -%}
          {%- set groups.cur_start = short -%}{%- set groups.cur_end = short -%}{%- set groups.cur_fp = fp -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if groups.cur_fp is not none -%}
        {%- set _ = groups.items.append((groups.cur_start, groups.cur_end, groups.cur_fp)) -%}
      {%- endif -%}
      {% for s, e, fp in groups.items -%}
      **{{ s }}{% if e != s %}–{{ e }}{% endif %}**&nbsp;&nbsp;{{ fp }}{% if not loop.last %}<br>{% endif %}
      {%- endfor %}

      ☀ Comfort **{{ '%.1f' | format(comfort_t) }}°** · ☾ Reduced **{{ '%.1f' | format(reduced_t) }}°** outside

  ##################################################################
  # 4) Hot water card (Hot water screen)
  ##################################################################
  - type: entities
    title: Hot water
    state_color: true
    entities:
      - entity: sensor.elco_domestic_hot_water_storage_temperature
        name: Current temperature
        icon: mdi:thermometer-water
      - entity: input_number.elco_dhw_comfort_temp_set
        name: Target temperature
        icon: mdi:water-thermometer
      - entity: input_select.elco_dhw_mode_set
        name: Mode
        icon: mdi:water-boiler
      - entity: binary_sensor.elco_domestic_hot_water_enabled
        name: Enabled
    footer:
      type: graph
      entity: sensor.elco_domestic_hot_water_storage_temperature
      hours_to_show: 24
      detail: 1

  ##################################################################
  # 5) Holiday card
  #
  # Drives /api/v2/remote/bsbHolidays/<gw>/<zone> via AppDaemon. The boiler
  # has 8 holiday slots; we always write slot 0 (mirrors what the Remocon
  # mobile app does).
  # - "Return date" input_datetime → the to-date of the slot (return day)
  # - "Holiday active" toggle on  → write {from=today, to=return_date}
  # - "Holiday active" toggle off → write the empty marker (2026-01-01)
  ##################################################################
  - type: vertical-stack
    cards:
      - type: markdown
        title: Upcoming auto-trigger holidays
        content: |
          {%- set evs = state_attr('sensor.elco_upcoming_holidays', 'events') or [] %}
          {%- if evs %}
          {%- for e in evs %}
          {%- set s = e.start %}
          {%- set en = e.end %}
          {%- set sd = (s | as_datetime).strftime('%a %d %b %Y') if 'T' in s else (strptime(s, '%Y-%m-%d')).strftime('%a %d %b %Y') %}
          {%- set ed_raw = (en | as_datetime) if 'T' in en else (strptime(en, '%Y-%m-%d')) %}
          {%- set ed = (ed_raw - timedelta(days=1)).strftime('%a %d %b %Y') %}
          - **{{ e.summary }}** — off {{ sd }} → return {{ ed }}
          {%- endfor %}
          {%- else %}
          _None._
          {%- endif %}

          Prefix `calendar.family` titles with `Vacanz*` to auto-enrol.
      - type: entities
        state_color: true
        entities:
          - entity: input_boolean.elco_holiday_active
            name: Holiday active
            icon: mdi:airplane
            secondary_info: last-changed
          - entity: input_datetime.elco_holiday_until
            name: Return date
            icon: mdi:calendar-end
          - entity: input_boolean.elco_holiday_use_reduced
            name: Stay in Reduced (else fully off)
            icon: mdi:weather-night
          - entity: input_button.elco_holidays_refresh
            name: Refresh upcoming
            icon: mdi:calendar-refresh

  ##################################################################
  # 6) Gas: today + monthly comparison
  #
  # Top row: today's flame runtime / kWh / cost (from history_stats
  # + utility_meter daily + cost template).
  #
  # Markdown table: this/last/2-months-ago/same-month-last-year — sourced
  # from sensor.elco_heating_monthly_history (trigger-template that calls
  # recorder.statistics_during_period every 6h). Missing months render as
  # "—" until enough history accumulates.
  ##################################################################
  - type: vertical-stack
    cards:
      - type: glance
        title: Today
        show_state: true
        columns: 3
        entities:
          - entity: sensor.elco_flame_on_today
            name: Flame
          - entity: sensor.elco_heating_energy_day
            name: Energy
          - entity: sensor.elco_heating_cost_today
            name: Cost
      - type: markdown
        content: |
          {%- set price = states('sensor.elco_gas_price') | float(0) -%}
          {%- set hist = state_attr('sensor.elco_heating_monthly_history','history') or [] -%}
          {#- Build a {YYYY-MM: kWh} dict. recorder/statistics_during_period
              returns `start` as a millisecond unix timestamp; convert. -#}
          {%- set by_month = namespace(d={}) -%}
          {%- for h in hist -%}
            {%- set s = h.start -%}
            {%- if s is number -%}
              {%- set k = (s / 1000) | timestamp_custom('%Y-%m', false) -%}
            {%- else -%}
              {%- set k = s[:7] -%}
            {%- endif -%}
            {%- set _ = by_month.d.update({k: (h.change | float(0))}) -%}
          {%- endfor -%}
          {%- set tm = now() -%}
          {%- set lm = (tm.replace(day=1) - timedelta(days=1)) -%}
          {%- set lm2 = (lm.replace(day=1) - timedelta(days=1)) -%}
          {%- set this_kwh = states('sensor.elco_heating_energy_period') | float(0) -%}
          {%- macro fmt(yy, mm) -%}
            {%- set k = '%04d-%02d' % (yy, mm) -%}
            {%- if k in by_month.d -%}
              {%- set kwh = by_month.d[k] -%}
              {{ '%.1f' | format(kwh) }} kWh · {{ '%.2f' | format(kwh * price) }} CHF
            {%- else -%}—{%- endif -%}
          {%- endmacro -%}
          | Period | Usage |
          |--------|-------|
          | **This month** ({{ tm.strftime('%b %Y') }}) | {{ '%.1f' | format(this_kwh) }} kWh · {{ '%.2f' | format(this_kwh * price) }} CHF |
          | Last month ({{ lm.strftime('%b %Y') }}) | {{ fmt(lm.year, lm.month) }} |
          | 2 months ago ({{ lm2.strftime('%b %Y') }}) | {{ fmt(lm2.year, lm2.month) }} |
          | Same month last year ({{ tm.year - 1 }}) | {{ fmt(tm.year - 1, tm.month) }} |

          Price **{{ price }} CHF/kWh**.

  ##################################################################
  # 7) Heating curve diagnostic — two-line overlay over 7 days.
  #    If desired (orange) tracks outside (blue) inversely with the
  #    right slope and offset, the boiler curve is well-tuned. If
  #    desired stays flat through cold spells or overshoots warm
  #    days, slope/parallel needs adjusting at the boiler menu.
  ##################################################################
  - type: history-graph
    title: Heating curve (last 7d)
    hours_to_show: 168
    refresh_interval: 600
    entities:
      - entity: sensor.elco_outside_temperature
        name: Outside
      - entity: sensor.elco_desired_room_temperature
        name: Desired room

  ##################################################################
  # 8) Plant detail (Boiler status)
  ##################################################################
  - type: entities
    title: Boiler status
    state_color: true
    entities:
      - entity: binary_sensor.elco_flame_sensor
        name: Flame
      - entity: binary_sensor.elco_heatpump_on
        name: Heat pump
      - entity: binary_sensor.elco_room_heating_is_active
        name: Heating active
      - entity: binary_sensor.elco_room_heating_is_request
        name: Heating request pending
      - entity: binary_sensor.elco_domestic_hot_water_enabled
        name: DHW enabled
      - entity: sensor.elco_room_operation_mode_heating
        name: Operation mode
      - type: section
      - entity: binary_sensor.elco_outside_temperature_error
        name: Outside probe error
      - entity: binary_sensor.elco_domestic_hot_water_storage_temperature_error
        name: DHW probe error
      - entity: binary_sensor.elco_room_temperature_error
        name: Room probe error
    footer:
      type: graph
      entity: sensor.elco_room_temperature
      hours_to_show: 48
      detail: 2
